<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Streamed rendering fixture</title>
  <style>
    @page { margin: 12mm; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: #16242d;
      background: #f4ead8;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: 100%; min-height: 100vh; padding: 28px; }
    .card {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      overflow: hidden;
      border: 3px solid #16242d;
      background: #fffaf0;
      box-shadow: 10px 10px 0 #d8503f;
    }
    .copy { padding: 24px; }
    h1 { margin: 0 0 10px; font-size: 42px; line-height: 0.95; }
    p { margin: 0; font-size: 17px; line-height: 1.45; }
    .label {
      display: inline-block;
      margin-bottom: 18px;
      padding: 5px 9px;
      color: #fffaf0;
      background: #16242d;
      font: bold 12px/1 Verdana, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    svg { display: block; width: 100%; height: 100%; min-height: 250px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="copy">
        <span class="label">cef-pdf fixture 01</span>
        <h1>One stream,<br>three formats.</h1>
        <p>This tracked document exercises CSS layout, web fonts, gradients, clipping, patterns, and inline SVG in one local render.</p>
      </div>
      <svg viewBox="0 0 420 320" role="img" aria-label="Geometric sunrise">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#126782"/>
            <stop offset="1" stop-color="#80ced7"/>
          </linearGradient>
          <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
            <rect width="5" height="12" fill="#16242d"/>
          </pattern>
          <clipPath id="sun-cut"><circle cx="210" cy="180" r="92"/></clipPath>
        </defs>
        <rect width="420" height="320" fill="url(#sky)"/>
        <circle cx="210" cy="180" r="92" fill="#ffd166"/>
        <g clip-path="url(#sun-cut)" opacity="0.24">
          <rect x="110" y="88" width="200" height="190" fill="url(#hatch)"/>
        </g>
        <path d="M0 254 L82 194 L145 235 L232 151 L307 223 L359 183 L420 236 V320 H0 Z" fill="#254441"/>
        <path d="M0 284 C90 250 153 305 242 270 S360 249 420 279 V320 H0 Z" fill="#d8503f"/>
      </svg>
    </section>
  </main>
</body>
</html>
